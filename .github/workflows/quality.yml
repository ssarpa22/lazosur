name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Build-time placeholders only. Real Neon Auth credentials are supplied at runtime.
          NEON_AUTH_BASE_URL: https://ci-placeholder.neon.tech
          NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret-not-used-at-runtime-32chars
